name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.compiler }} ${{ matrix.build_type }}
    # Pinned rather than ubuntu-latest so compiler versions only change when this line does.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
        include:
          - compiler: gcc
            cxx: g++
          - compiler: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          ${{ matrix.cxx }} --version
          cmake --version

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: ${{ matrix.sanitizer }} sanitizer
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # ThreadSanitizer gets a smaller stress count: it slows every lock and memory access, and a
        # race is reported on the first unsynchronised access pair, so volume adds little detection.
        include:
          - sanitizer: address
            ops: 1000000
          - sanitizer: undefined
            ops: 1000000
          - sanitizer: thread
            ops: 250000
    env:
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
    steps:
      - uses: actions/checkout@v5

      # The ASan and TSan runtimes crash at startup when the kernel uses more mmap randomisation bits
      # than their shadow memory layout allows. This lowers the runner's setting to the traditional value.
      - name: Limit mmap randomisation
        run: |
          echo "vm.mmap_rnd_bits was $(sysctl -n vm.mmap_rnd_bits)"
          sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Show toolchain
        run: |
          clang++ --version
          cmake --version

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_COMPILER=clang++
          -DLRU_SANITIZER=${{ matrix.sanitizer }}
          -DLRU_CONCURRENT_OPS=${{ matrix.ops }}

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure
